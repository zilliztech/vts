env {
  parallelism = 1
  job.mode = "STREAMING"
}

source {
  "Milvus-CDC" {
    url = "http://milvus-e2e:19530"
    token = "root:Milvus"
    database_collections = {
      "default" = ["milvus_cdc_source_e2e"]
    }
    message_types = ["insert", "delete"]
    startup_mode = "cdc"
    channel_positions = [
      {
        pchannel = ${cdc_pchannel}
        start = {
          wal_name = "RocksMQ"
          resume_message_id = "-1"
          timetick = 0
        }
      }
    ]
  }
}

sink {
  Milvus {
    url = "http://milvus-e2e:19530"
    token = "root:Milvus"
    database = "default"
    collection_rename = {
      "milvus_cdc_source_e2e" = "milvus_cdc_target_e2e"
    }
    write_mode = "CDC"
    schema_save_mode = "ERROR_WHEN_SCHEMA_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
    batch_size = 1
  }
}
